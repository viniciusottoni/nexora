<!-- @dsCard group="Colors" viewport="700x150" name="Gradiente da marca" subtitle="Só em marca, hero e capa — nunca atrás de conteúdo ou dado" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="g"><div style="height:76px;border-radius:var(--radius-brand);background:var(--nx-gradient-brand)"></div>
<div class="r"><div style="flex:1;height:34px;border-radius:var(--radius-md);background:var(--nx-gradient-brand-soft)"></div>
<div style="flex:1;height:34px;border-radius:var(--radius-md);background:var(--nx-navy-900);color:#fff;font:var(--type-caption);display:flex;align-items:center;justify-content:center">conteúdo vai sobre navy sólido, não sobre gradiente</div></div></div></body></html>
