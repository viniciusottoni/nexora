<!-- @dsCard group="Colors" viewport="700x150" name="Semânticos" subtitle="Sucesso, atenção, erro e informação — com o par de fundo sutil" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r"><div class="sw" style="background:var(--nx-success-500);color:#fff"><b>success 500</b><span>#28A55C</span></div><div class="sw" style="background:var(--nx-success-100);color:var(--nx-navy-900)"><b>success 100</b><span>#DCF3E5</span></div><div class="sw" style="background:var(--nx-warning-500);color:var(--nx-navy-900)"><b>warning 500</b><span>#E8A302</span></div><div class="sw" style="background:var(--nx-warning-100);color:var(--nx-navy-900)"><b>warning 100</b><span>#FDF0D0</span></div><div class="sw" style="background:var(--nx-danger-600);color:#fff"><b>danger 600</b><span>#C42026</span></div><div class="sw" style="background:var(--nx-danger-100);color:var(--nx-navy-900)"><b>danger 100</b><span>#FBE0E1</span></div><div class="sw" style="background:var(--nx-blue-500);color:#fff"><b>info 500</b><span>#1F6FD0</span></div><div class="sw" style="background:var(--nx-blue-100);color:var(--nx-navy-900)"><b>info 100</b><span>#DCEAFB</span></div></div></body></html>
