<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r" style="align-items:stretch">
<div style="flex:1;background:var(--nx-success-100);border-radius:var(--radius-brand);padding:14px">
<div class="k" style="color:var(--nx-success-600);margin-bottom:8px">Assim</div>
<div style="font:var(--type-body);color:var(--nx-gray-800);line-height:1.9">“Enviar pedido”<br>“Pedido está com a cozinha”<br>“3 pedidos acima da meta agora”<br>“Teórico 41,2 kg × real 36,8 kg”</div></div>
<div style="flex:1;background:var(--nx-danger-100);border-radius:var(--radius-brand);padding:14px">
<div class="k" style="color:var(--nx-danger-600);margin-bottom:8px">Não assim</div>
<div style="font:var(--type-body);color:var(--nx-gray-800);line-height:1.9">“Submeter” · “Confirmar operação”<br>“Seu pedido foi processado com sucesso! 🎉”<br>“Ops! Algo deu errado”<br>“Divergência detectada no inventário”</div></div></div></body></html>
