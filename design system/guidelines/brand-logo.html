<!-- @dsCard group="Brand" viewport="760x300" name="Logo Nexora" subtitle="Vetorizado do JPEG fornecido — colorido sobre claro, branco sobre navy" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<title>Logo Nexora</title>
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}
.r{display:flex;gap:12px;align-items:stretch}
.b{border-radius:var(--radius-brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 14px;text-align:center;min-width:0}
.light{flex:2;background:#fff;border:1px solid var(--border-subtle)}
.dark{flex:2;background:var(--nx-navy-900)}
.sym{flex:1;background:var(--nx-gray-100);border:1px solid var(--border-subtle)}
.symdark{flex:1;background:var(--nx-navy-800)}
img{display:block;max-width:100%;height:auto}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
.dark .k,.symdark .k{color:rgba(255,255,255,.6)}
.f{font:400 10px/1.3 var(--font-mono);color:var(--text-muted);margin-top:12px}
</style></head><body>
<div class="r">
  <div class="b light"><img src="../assets/logo-nexora-horizontal.svg" alt="Nexora — Plataforma de Gestão Inteligente" style="width:280px">
    <span class="k">fundo claro → colorido</span></div>
  <div class="b dark"><img src="../assets/logo-nexora-horizontal-white.svg" alt="Nexora — Plataforma de Gestão Inteligente" style="width:280px">
    <span class="k">navy → branco</span></div>
  <div class="b sym"><img src="../assets/logo-nexora-symbol.svg" alt="Nexora" style="width:56px">
    <span class="k">símbolo</span></div>
  <div class="b symdark"><img src="../assets/logo-nexora-symbol-white.svg" alt="Nexora" style="width:56px">
    <span class="k">símbolo branco</span></div>
</div>
<p class="f">assets/logo-nexora-{horizontal,lockup,symbol}[-white].svg · vetorizados de Assets/logo.jpeg, gradiente amostrado da própria arte · em React use BrandMark/NexoraLogo (SVG inline)</p>
</body></html>
