<!-- @dsCard group="Colors" viewport="700x150" name="Superfície KDS" subtitle="data-surface=&quot;kds&quot; — fundo escuro para leitura a 1,5 m na cozinha" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div data-surface="kds" class="r" style="background:var(--surface-page);padding:14px;border-radius:var(--radius-brand)">
<div class="sw" style="background:var(--surface-page);color:#fff"><b>page #0B1620</b><span>fundo da tela</span></div><div class="sw" style="background:var(--surface-card);color:#fff"><b>card #12212E</b><span>cartão de pedido</span></div><div class="sw" style="background:var(--surface-raised);color:#fff"><b>raised #182C3C</b><span>tecla / sobreposto</span></div>
<div class="sw" style="background:var(--surface-card);border:1px solid var(--border-default);color:var(--text-primary)"><b>texto #F2F7FB</b><span style="color:var(--text-secondary)">secundário #9DB2C4</span></div></div></body></html>
