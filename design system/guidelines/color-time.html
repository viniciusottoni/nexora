<!-- @dsCard group="Colors" viewport="700x170" name="Escalonamento de tempo" subtitle="Verde → amarelo → vermelho: a linguagem de cor do KDS e de todo SLA" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r" style="align-items:stretch">
<div style="flex:1;background:var(--nx-time-ok-bg);border-radius:var(--radius-brand);padding:14px 16px;display:flex;flex-direction:column;gap:6px">
<span style="font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:#28A55C">no prazo</span>
<span style="font:var(--fw-bold) 34px/1 var(--font-mono);color:#28A55C">03:12</span>
<span style="font:var(--type-caption);color:#7E93A6">--nx-time-ok</span></div><div style="flex:1;background:var(--nx-time-warn-bg);border-radius:var(--radius-brand);padding:14px 16px;display:flex;flex-direction:column;gap:6px">
<span style="font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:#E8A302">atenção</span>
<span style="font:var(--fw-bold) 34px/1 var(--font-mono);color:#E8A302">06:48</span>
<span style="font:var(--type-caption);color:#7E93A6">--nx-time-warn</span></div><div style="flex:1;background:var(--nx-time-late-bg);border-radius:var(--radius-brand);padding:14px 16px;display:flex;flex-direction:column;gap:6px">
<span style="font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:#E0393F">atrasado</span>
<span style="font:var(--fw-bold) 34px/1 var(--font-mono);color:#E0393F">12:31</span>
<span style="font:var(--type-caption);color:#7E93A6">--nx-time-late</span></div></div></body></html>
