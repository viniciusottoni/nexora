<!-- @dsCard group="Colors" viewport="700x170" name="Camada de tenant" subtitle="A mesma UI com os tokens de marca trocados em runtime (white-label)" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r" style="align-items:stretch">
<div style="flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-brand);padding:14px">
<div class="k" style="margin-bottom:10px">Nexora (plataforma)</div>
<div style="display:flex;gap:8px;align-items:center"><span style="height:38px;padding:0 18px;border-radius:12px;background:var(--nx-navy-800);color:#fff;font:var(--fw-semibold) 14px/38px var(--font-sans)">Confirmar</span>
<span style="width:38px;height:38px;border-radius:12px;background:var(--nx-cyan-500)"></span><span style="width:38px;height:38px;border-radius:12px;background:var(--nx-gray-50);border:1px solid var(--border-subtle)"></span></div>
<div style="font:var(--type-caption);color:var(--text-muted);margin-top:10px">--brand-primary: #10305E</div></div>
<div data-tenant="dona-betinha" style="flex:1;border:1px solid var(--border-subtle);border-radius:var(--radius-brand);padding:14px;background:var(--brand-surface)">
<div class="k" style="margin-bottom:10px">Dona Betinha (instância)</div>
<div style="display:flex;gap:8px;align-items:center"><span style="height:38px;padding:0 18px;border-radius:var(--brand-radius);background:var(--brand-primary);color:var(--brand-on-primary);font:var(--fw-semibold) 14px/38px var(--font-sans)">Confirmar</span>
<span style="width:38px;height:38px;border-radius:12px;background:var(--brand-secondary)"></span><span style="width:38px;height:38px;border-radius:12px;background:#fff;border:1px solid var(--border-subtle)"></span></div>
<div style="font:var(--type-caption);color:var(--text-muted);margin-top:10px">--brand-primary: #C1121F</div></div></div></body></html>
