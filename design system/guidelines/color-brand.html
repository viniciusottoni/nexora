<!-- @dsCard group="Colors" viewport="700x150" name="Rampa da marca" subtitle="Extraída do gradiente do logo: navy → azul → ciano → verde" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r"><div class="sw" style="background:var(--nx-navy-900);color:#fff"><b>navy 900</b><span>#0B1F3F</span></div><div class="sw" style="background:var(--nx-navy-800);color:#fff"><b>navy 800</b><span>#10305E</span></div><div class="sw" style="background:var(--nx-navy-600);color:#fff"><b>navy 600</b><span>#1D5299</span></div><div class="sw" style="background:var(--nx-blue-500);color:#fff"><b>blue 500</b><span>#1F6FD0</span></div><div class="sw" style="background:var(--nx-cyan-500);color:#fff"><b>cyan 500</b><span>#0FA3C8</span></div><div class="sw" style="background:var(--nx-teal-500);color:#fff"><b>teal 500</b><span>#10B394</span></div><div class="sw" style="background:var(--nx-green-500);color:var(--nx-navy-900)"><b>green 500</b><span>#6FBE2C</span></div><div class="sw" style="background:var(--nx-green-400);color:var(--nx-navy-900)"><b>green 400</b><span>#8FD44A</span></div></div></body></html>
