<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r"><div style="flex:1;text-align:center"><div style="height:56px;background:var(--nx-gray-100);border:1px solid var(--border-default);border-radius:4px"></div><div class="k" style="margin-top:6px">xs · 4px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--nx-gray-100);border:1px solid var(--border-default);border-radius:6px"></div><div class="k" style="margin-top:6px">sm · 6px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--nx-gray-100);border:1px solid var(--border-default);border-radius:10px"></div><div class="k" style="margin-top:6px">md · 10px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--nx-gray-100);border:1px solid var(--border-default);border-radius:12px"></div><div class="k" style="margin-top:6px">brand · 12px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--nx-gray-100);border:1px solid var(--border-default);border-radius:16px"></div><div class="k" style="margin-top:6px">lg · 16px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--nx-gray-100);border:1px solid var(--border-default);border-radius:24px"></div><div class="k" style="margin-top:6px">xl · 24px</div></div><div style="flex:1;text-align:center"><div style="height:56px;background:var(--nx-gray-100);border:1px solid var(--border-default);border-radius:999px"></div><div class="k" style="margin-top:6px">pill · 999px</div></div></div></body></html>
