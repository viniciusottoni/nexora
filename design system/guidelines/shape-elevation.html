<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r" style="padding:8px 0"><div style="flex:1;height:88px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-brand);box-shadow:var(--shadow-subtle);display:flex;align-items:flex-end;padding:10px"><span class="k">subtle</span></div><div style="flex:1;height:88px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-brand);box-shadow:var(--shadow-card);display:flex;align-items:flex-end;padding:10px"><span class="k">card</span></div><div style="flex:1;height:88px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-brand);box-shadow:var(--shadow-raised);display:flex;align-items:flex-end;padding:10px"><span class="k">raised</span></div><div style="flex:1;height:88px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-brand);box-shadow:var(--shadow-overlay);display:flex;align-items:flex-end;padding:10px"><span class="k">overlay</span></div></div></body></html>
