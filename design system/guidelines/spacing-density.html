<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="g">
<div class="r" style="align-items:center"><span class="k" style="width:120px">toque · 64px</span><span style="height:64px;padding:0 24px;background:var(--nx-navy-800);color:#fff;border-radius:12px;font:var(--fw-semibold) 18px/64px var(--font-sans)">Enviar pedido</span></div>
<div class="r" style="align-items:center"><span class="k" style="width:120px">toque min · 48px</span><span style="height:48px;padding:0 20px;background:#fff;border:1px solid var(--border-default);border-radius:12px;font:var(--fw-semibold) 16px/48px var(--font-sans)">Chamar garçom</span></div>
<div class="r" style="align-items:center"><span class="k" style="width:120px">gestão · 36px</span><span style="height:36px;padding:0 12px;background:#fff;border:1px solid var(--border-default);border-radius:10px;font:var(--fw-semibold) 13px/36px var(--font-sans)">Exportar</span></div></div></body></html>
