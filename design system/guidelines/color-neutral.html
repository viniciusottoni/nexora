<!-- @dsCard group="Colors" viewport="700x150" name="Neutros" subtitle="Cinzas com viés frio de navy — texto, borda e superfície" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-card)}.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{border-radius:var(--radius-md);height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;flex:1 1 0;min-width:0;overflow:hidden}
.sw b{font:var(--fw-semibold) 11px/1.2 var(--font-sans);letter-spacing:.02em}
.sw span{font:400 10px/1.2 var(--font-mono);opacity:.72}
.k{font:var(--type-overline);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r"><div class="sw" style="background:var(--nx-gray-50);color:var(--nx-navy-900)"><b>50</b><span>#F6F8FB</span></div><div class="sw" style="background:var(--nx-gray-100);color:var(--nx-navy-900)"><b>100</b><span>#EEF2F7</span></div><div class="sw" style="background:var(--nx-gray-200);color:var(--nx-navy-900)"><b>200</b><span>#DFE6EF</span></div><div class="sw" style="background:var(--nx-gray-300);color:var(--nx-navy-900)"><b>300</b><span>#C6D0DD</span></div><div class="sw" style="background:var(--nx-gray-400);color:var(--nx-navy-900)"><b>400</b><span>#97A4B6</span></div><div class="sw" style="background:var(--nx-gray-500);color:#fff"><b>500</b><span>#6B7A8F</span></div><div class="sw" style="background:var(--nx-gray-600);color:#fff"><b>600</b><span>#4A5A70</span></div><div class="sw" style="background:var(--nx-gray-700);color:#fff"><b>700</b><span>#33455C</span></div><div class="sw" style="background:var(--nx-gray-800);color:#fff"><b>800</b><span>#1F2E44</span></div><div class="sw" style="background:var(--nx-gray-900);color:#fff"><b>900</b><span>#101C2E</span></div></div></body></html>
