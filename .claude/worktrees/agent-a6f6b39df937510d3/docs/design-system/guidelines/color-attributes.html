<!-- @dsCard group="Colors" viewport="700x150" name="Character Attributes" subtitle="The six hunter attributes, each with a fixed color" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 22px 20px; font-family: var(--font-body); }
  .wrap { display:flex; gap:12px; }
  .a { flex:1; }
  .bar { height:10px; border-radius:var(--radius-pill); margin-bottom:9px; }
  .nm { font-family:var(--font-display); font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-secondary); }
  .h { font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); margin-top:3px; }
</style></head>
<body>
  <div class="wrap">
    <div class="a"><div class="bar" style="background:var(--attr-strength)"></div><div class="nm">Força</div><div class="h">--attr-strength</div></div>
    <div class="a"><div class="bar" style="background:var(--attr-agility)"></div><div class="nm">Agilidade</div><div class="h">--attr-agility</div></div>
    <div class="a"><div class="bar" style="background:var(--attr-endurance)"></div><div class="nm">Resistência</div><div class="h">--attr-endurance</div></div>
    <div class="a"><div class="bar" style="background:var(--attr-vitality)"></div><div class="nm">Vitalidade</div><div class="h">--attr-vitality</div></div>
    <div class="a"><div class="bar" style="background:var(--attr-focus)"></div><div class="nm">Foco</div><div class="h">--attr-focus</div></div>
    <div class="a"><div class="bar" style="background:var(--attr-wisdom)"></div><div class="nm">Sabedoria</div><div class="h">--attr-wisdom</div></div>
  </div>
</body></html>
