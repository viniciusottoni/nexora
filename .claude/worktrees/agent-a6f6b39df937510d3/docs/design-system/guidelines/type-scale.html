<!-- @dsCard group="Type" viewport="700x280" name="Type Scale" subtitle="Mobile-first scale from display 40 to caption 11" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 22px 24px; font-family: var(--font-body); color: var(--text-primary); }
  .line { display:flex; align-items:baseline; gap:16px; padding:5px 0; border-bottom:1px solid var(--divider); }
  .tok { font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); width:150px; flex-shrink:0; }
  .ex { font-family:var(--font-display); font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style></head>
<body>
  <div class="line"><span class="tok">--fs-display · 40</span><span class="ex" style="font-size:40px">Awaken</span></div>
  <div class="line"><span class="tok">--fs-h1 · 30</span><span class="ex" style="font-size:30px">Quest diária</span></div>
  <div class="line"><span class="tok">--fs-h2 · 24</span><span class="ex" style="font-size:24px">Seu perfil de hunter</span></div>
  <div class="line"><span class="tok">--fs-h3 · 20</span><span class="ex" style="font-size:20px">Atributos & progresso</span></div>
  <div class="line"><span class="tok">--fs-body · 15</span><span class="ex" style="font-size:15px;font-family:var(--font-body);font-weight:400">Texto de corpo padrão da interface</span></div>
  <div class="line"><span class="tok">--fs-xs · 11</span><span class="ex" style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-tertiary)">Label / eyebrow</span></div>
</body></html>
