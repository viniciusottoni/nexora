<!-- @dsCard group="Spacing" viewport="700x210" name="Elevation & Glow" subtitle="Black depth shadows + colored energy glows — the two elevation languages" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 26px 24px; font-family: var(--font-mono); }
  .row { display:flex; gap:22px; flex-wrap:wrap; }
  .c { text-align:center; }
  .bx { width:104px; height:74px; border-radius:var(--radius-lg); background:var(--bg-surface); border:1px solid var(--border-default); }
  .t { font-size:10px; color:var(--text-tertiary); margin-top:12px; }
</style></head>
<body>
  <div class="row">
    <div class="c"><div class="bx" style="box-shadow:var(--shadow-sm)"></div><div class="t">shadow-sm</div></div>
    <div class="c"><div class="bx" style="box-shadow:var(--shadow-md)"></div><div class="t">shadow-md</div></div>
    <div class="c"><div class="bx" style="box-shadow:var(--shadow-lg)"></div><div class="t">shadow-lg</div></div>
    <div class="c"><div class="bx" style="box-shadow:var(--glow-blue)"></div><div class="t">glow-blue</div></div>
    <div class="c"><div class="bx" style="box-shadow:var(--glow-purple)"></div><div class="t">glow-purple</div></div>
    <div class="c"><div class="bx" style="box-shadow:var(--glow-gold)"></div><div class="t">glow-gold</div></div>
  </div>
</body></html>
