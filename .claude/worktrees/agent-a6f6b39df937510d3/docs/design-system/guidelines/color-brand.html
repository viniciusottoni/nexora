<!-- @dsCard group="Colors" viewport="700x190" name="Brand — Energy" subtitle="Electric blue primary, blue-flame purple, XP gold + the signature gradient" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 20px; font-family: var(--font-body); }
  .wrap { display:flex; gap:14px; }
  .sw { flex:1; height:120px; border-radius: var(--radius-md); display:flex; flex-direction:column; justify-content:flex-end; padding:12px; border:1px solid var(--border-subtle); }
  .n { font-family: var(--font-display); font-size:13px; font-weight:600; color:#fff; letter-spacing:.02em; }
  .h { font-family: var(--font-mono); font-size:11px; color:rgba(255,255,255,.7); margin-top:2px; }
</style></head>
<body>
  <div class="wrap">
    <div class="sw" style="background:var(--blue-500)"><span class="n">Primary</span><span class="h">#2D6FF5</span></div>
    <div class="sw" style="background:var(--purple-500)"><span class="n">Secondary</span><span class="h">#8B3FD8</span></div>
    <div class="sw" style="background:var(--gold-500)"><span class="n" style="color:#1A1400">Accent · XP</span><span class="h" style="color:rgba(0,0,0,.6)">#F5C518</span></div>
    <div class="sw" style="background:var(--cyan-400)"><span class="n" style="color:#04141A">Spark</span><span class="h" style="color:rgba(0,0,0,.6)">#5FE8FF</span></div>
    <div class="sw" style="background:var(--grad-energy)"><span class="n">Energy gradient</span><span class="h">blue → purple</span></div>
  </div>
</body></html>
