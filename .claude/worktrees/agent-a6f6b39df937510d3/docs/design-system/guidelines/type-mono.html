<!-- @dsCard group="Type" viewport="700x180" name="Mono — JetBrains Mono" subtitle="Tabular figures for stats, XP, timers and ranks" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 24px; font-family: var(--font-mono); color: var(--text-primary); }
  .meta { font-family: var(--font-mono); font-size:11px; color:var(--text-tertiary); margin-bottom:18px; }
  .row { display:flex; gap:34px; align-items:baseline; }
  .stat { color:var(--gold-400); font-size:30px; font-weight:700; }
  .cap { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-tertiary); }
</style></head>
<body>
  <div class="meta">font-family: var(--font-mono) · JetBrains Mono · tabular-nums</div>
  <div class="row">
    <div><div class="stat tnum">640 / 900</div><div class="cap">XP</div></div>
    <div><div class="stat tnum" style="color:var(--blue-300)">12</div><div class="cap">Streak</div></div>
    <div><div class="stat tnum" style="color:var(--text-primary)">00:42:18</div><div class="cap">Tempo</div></div>
    <div><div class="stat tnum" style="color:var(--attr-strength)">+72</div><div class="cap">Força</div></div>
  </div>
</body></html>
