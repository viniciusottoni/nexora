<!-- @dsCard group="Brand" viewport="700x200" name="Gradients" subtitle="The signature energy gradient + XP, spark, rank and void washes" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 20px; font-family: var(--font-body); }
  .wrap { display:flex; gap:12px; }
  .sw { flex:1; height:130px; border-radius:var(--radius-md); border:1px solid var(--border-subtle); display:flex; align-items:flex-end; padding:11px; }
  .n { font-family:var(--font-mono); font-size:11px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6); }
</style></head>
<body>
  <div class="wrap">
    <div class="sw" style="background:var(--grad-energy)"><span class="n">--grad-energy</span></div>
    <div class="sw" style="background:var(--grad-xp)"><span class="n" style="color:#1A1400;text-shadow:none">--grad-xp</span></div>
    <div class="sw" style="background:var(--grad-spark)"><span class="n">--grad-spark</span></div>
    <div class="sw" style="background:var(--grad-rank-ss)"><span class="n">--grad-rank-ss</span></div>
    <div class="sw" style="background:var(--grad-rank-sss)"><span class="n">--grad-rank-sss</span></div>
    <div class="sw" style="background:var(--grad-void)"><span class="n">--grad-void</span></div>
  </div>
</body></html>
