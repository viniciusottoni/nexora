<!-- @dsCard group="Colors" viewport="700x200" name="Surfaces & Ink" subtitle="Deep-void backgrounds and the elevation ladder" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 20px; font-family: var(--font-body); }
  .wrap { display:flex; gap:10px; }
  .sw { flex:1; height:130px; border-radius: var(--radius-md); display:flex; flex-direction:column; justify-content:flex-end; padding:11px; border:1px solid var(--border-default); }
  .n { font-family: var(--font-display); font-size:12px; font-weight:600; color:var(--text-primary); }
  .h { font-family: var(--font-mono); font-size:10px; color:var(--text-tertiary); margin-top:2px; }
</style></head>
<body>
  <div class="wrap">
    <div class="sw" style="background:var(--void)"><span class="n">Void</span><span class="h">--bg-void</span></div>
    <div class="sw" style="background:var(--ink-950)"><span class="n">Base</span><span class="h">--bg-base</span></div>
    <div class="sw" style="background:var(--ink-850)"><span class="n">Surface</span><span class="h">--bg-surface</span></div>
    <div class="sw" style="background:var(--ink-800)"><span class="n">Elevated</span><span class="h">--bg-elevated</span></div>
    <div class="sw" style="background:var(--ink-700)"><span class="n">Overlay</span><span class="h">--bg-overlay</span></div>
    <div class="sw" style="background:var(--ink-500)"><span class="n">Line / 500</span><span class="h">--ink-500</span></div>
  </div>
</body></html>
