<!-- @dsCard group="Colors" viewport="700x170" name="Rank Ladder" subtitle="E → SSS progression colors — the heart of the system" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 22px 20px; font-family: var(--font-body); }
  .wrap { display:flex; gap:10px; }
  .r { flex:1; text-align:center; }
  .hex { width:100%; aspect-ratio:1/1.1; max-width:66px; margin:0 auto 9px; clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:20px; color:#0A0B12; }
  .nm { font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); }
</style></head>
<body>
  <div class="wrap">
    <div class="r"><div class="hex" style="background:var(--rank-e)">E</div><div class="nm">--rank-e</div></div>
    <div class="r"><div class="hex" style="background:var(--rank-d)">D</div><div class="nm">--rank-d</div></div>
    <div class="r"><div class="hex" style="background:var(--rank-c)">C</div><div class="nm">--rank-c</div></div>
    <div class="r"><div class="hex" style="background:var(--rank-b)">B</div><div class="nm">--rank-b</div></div>
    <div class="r"><div class="hex" style="background:var(--rank-a)">A</div><div class="nm">--rank-a</div></div>
    <div class="r"><div class="hex" style="background:var(--rank-s)">S</div><div class="nm">--rank-s</div></div>
    <div class="r"><div class="hex" style="background:var(--grad-rank-ss)">SS</div><div class="nm">--rank-ss</div></div>
    <div class="r"><div class="hex" style="background:var(--grad-rank-sss)">SSS</div><div class="nm">--rank-sss</div></div>
  </div>
</body></html>
