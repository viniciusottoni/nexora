<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base — from 2px up to 80px" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 22px 24px; font-family: var(--font-mono); }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .c { text-align:center; }
  .bx { background:var(--grad-energy); border-radius:3px; width:var(--w); }
  .t { font-size:10px; color:var(--text-tertiary); margin-top:7px; }
</style></head>
<body>
  <div class="row">
    <div class="c"><div class="bx" style="--w:4px;height:4px"></div><div class="t">2·4</div></div>
    <div class="c"><div class="bx" style="--w:8px;height:8px"></div><div class="t">8</div></div>
    <div class="c"><div class="bx" style="--w:12px;height:12px"></div><div class="t">12</div></div>
    <div class="c"><div class="bx" style="--w:16px;height:16px"></div><div class="t">16</div></div>
    <div class="c"><div class="bx" style="--w:20px;height:20px"></div><div class="t">20</div></div>
    <div class="c"><div class="bx" style="--w:24px;height:24px"></div><div class="t">24</div></div>
    <div class="c"><div class="bx" style="--w:32px;height:32px"></div><div class="t">32</div></div>
    <div class="c"><div class="bx" style="--w:40px;height:40px"></div><div class="t">40</div></div>
    <div class="c"><div class="bx" style="--w:48px;height:48px"></div><div class="t">48</div></div>
    <div class="c"><div class="bx" style="--w:64px;height:64px"></div><div class="t">64</div></div>
  </div>
</body></html>
