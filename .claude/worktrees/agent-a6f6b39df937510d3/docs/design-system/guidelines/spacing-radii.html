<!-- @dsCard group="Spacing" viewport="700x180" name="Radii" subtitle="From the sharp 'blade' corner to the full pill" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background: var(--bg-base); padding: 22px 24px; font-family: var(--font-mono); }
  .row { display:flex; gap:16px; }
  .c { text-align:center; }
  .bx { width:78px; height:78px; background:var(--bg-elevated); border:1.5px solid var(--border-strong); }
  .t { font-size:10px; color:var(--text-tertiary); margin-top:8px; }
</style></head>
<body>
  <div class="row">
    <div class="c"><div class="bx" style="border-radius:var(--radius-blade)"></div><div class="t">blade · 4</div></div>
    <div class="c"><div class="bx" style="border-radius:var(--radius-sm)"></div><div class="t">sm · 10</div></div>
    <div class="c"><div class="bx" style="border-radius:var(--radius-md)"></div><div class="t">md · 14</div></div>
    <div class="c"><div class="bx" style="border-radius:var(--radius-lg)"></div><div class="t">lg · 18 (card)</div></div>
    <div class="c"><div class="bx" style="border-radius:var(--radius-xl)"></div><div class="t">xl · 24</div></div>
    <div class="c"><div class="bx" style="border-radius:var(--radius-pill)"></div><div class="t">pill</div></div>
  </div>
</body></html>
