<!-- @dsCard group="Components" viewport="940x880" name="Game — Ranks, XP, Stats & Quests" subtitle="RankBadge, XPBar, StatBar, QuestCard, ProgressRing, SystemWindow" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--grad-void); padding: 24px; }
  .lbl { font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-tertiary); margin: 0 0 12px; }
  .ranks { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 22px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { RankBadge, XPBar, StatBar, QuestCard, ProgressRing, SystemWindow } = window.AwakenDesignSystem_956798;
const Dumb = () => (<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6.5 6.5 11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7"/></svg>);

function Demo() {
  const [done, setDone] = React.useState(false);
  return (
    <div>
      <p className="lbl">Rank Ladder · E → SSS</p>
      <div className="ranks">
        {['E','D','C','B','A','S','SS','SSS'].map(r => <RankBadge key={r} rank={r} size={58} />)}
      </div>

      <div className="grid2">
        <div>
          <p className="lbl">XP & Nível</p>
          <XPBar level={37} value={640} max={900} style={{marginBottom: 22}} />
          <p className="lbl">Atributos</p>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <StatBar attr="strength" value={72} />
            <StatBar attr="agility" value={54} />
            <StatBar attr="endurance" value={88} />
            <StatBar attr="vitality" value={61} />
            <StatBar attr="focus" value={40} />
          </div>
        </div>
        <div>
          <p className="lbl">Quests</p>
          <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:22}}>
            <QuestCard title="Flexões — 4x12" subtitle="Sem equipamento" xp={120} rewards={[{attr:'strength',amount:3},{attr:'endurance',amount:1}]} status={done?'done':'active'} icon={<Dumb/>} onToggle={()=>setDone(!done)} />
            <QuestCard title="Corrida leve 15min" xp={90} rewards={[{attr:'endurance',amount:2}]} status="todo" />
          </div>
          <p className="lbl">Anéis de progresso</p>
          <div style={{display:'flex',gap:18}}>
            <ProgressRing value={6} max={8} size={92} color="energy" label="6" sublabel="copos" />
            <ProgressRing value={1800} max={2200} size={92} color="var(--attr-vitality)" sublabel="kcal" />
          </div>
        </div>
      </div>

      <p className="lbl" style={{marginTop:28}}>System Windows · Quest Diária / Dungeon / Raid</p>
      <div style={{display:'flex',flexWrap:'wrap',gap:20,alignItems:'flex-start'}}>
        <SystemWindow
          kind="daily"
          title="Treino do Dia — Tronco"
          rank="C"
          goals={[
            {label:'Flexões', current:40, target:100, unit:'reps'},
            {label:'Prancha', current:90, target:120, unit:'s'},
            {label:'Corrida leve', done:true},
          ]}
          xp={180}
          rewards={[{attr:'strength',amount:3},{attr:'endurance',amount:1}]}
          cta="Aceitar Quest"
          style={{maxWidth:300}}
        />
        <SystemWindow
          kind="dungeon"
          title="Mobilidade de Quadril"
          description="Side quest · treino pontual"
          goals={[{label:'Alongamento guiado', current:1, target:1, unit:'série'}]}
          xp={90}
          rewards={[{attr:'agility',amount:2}]}
          cta="Entrar na Dungeon"
          style={{maxWidth:300}}
        />
        <SystemWindow
          kind="raid"
          title="Desafio do Esquadrão"
          rank="S"
          description="Só ativa em grupo"
          participants={{current:3, max:5}}
          xp={500}
          rewards={[{attr:'vitality',amount:4},{attr:'focus',amount:2}]}
          cta="Reunir Esquadrão"
          style={{maxWidth:300}}
        />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
