<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awaken Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07080D;--ink-950:#0A0B12;--ink-900:#0E1019;--ink-850:#111320;
  --ink-800:#161929;--ink-700:#1D2133;--ink-600:#262B41;--ink-500:#333A55;
  --blue-500:#2D6FF5;--blue-400:#4D8BFF;--blue-300:#7FB0FF;
  --purple-500:#8B3FD8;--purple-400:#A65CEE;--purple-300:#C088F6;
  --gold-500:#F5C518;--gold-400:#FFD64A;--cyan-400:#5FE8FF;
  --mist-100:#F2F5FF;--mist-300:#C3C9E6;--mist-400:#AEB4D0;
  --mist-500:#828AAE;--mist-600:#5E6488;--mist-700:#474C66;
  --green-500:#22C55E;--red-500:#EF4444;--orange-500:#FF9500;
  --border-subtle:rgba(255,255,255,0.06);--border-default:rgba(255,255,255,0.10);
  --sidebar-w:220px;--topbar-h:60px;
}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;font-family:'Sora',system-ui,sans-serif;font-size:14px;color:var(--mist-300);background:var(--ink-950);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;}
h1,h2,h3,h4,h5{font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;letter-spacing:-0.01em;margin:0;}
*{scrollbar-width:thin;scrollbar-color:var(--ink-600) transparent;}
*::-webkit-scrollbar{width:5px;height:5px;}
*::-webkit-scrollbar-thumb{background:var(--ink-600);border-radius:99px;}

/* LAYOUT */
.shell{display:flex;height:100vh;}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--void);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;overflow:hidden;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:var(--topbar-h);flex-shrink:0;background:var(--ink-950);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px;}
.content{flex:1;overflow-y:auto;padding:28px 28px 40px;}

/* SIDEBAR */
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border-subtle);}
.sb-logo img{height:32px;filter:drop-shadow(0 0 10px rgba(45,111,245,0.4));}
.sb-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--mist-600);font-size:13px;font-weight:500;transition:background 0.15s,color 0.15s;border:none;background:none;width:100%;text-align:left;font-family:'Sora',sans-serif;}
.nav-item svg{flex-shrink:0;opacity:0.7;}
.nav-item:hover{background:var(--ink-900);color:var(--mist-400);}
.nav-item.active{background:rgba(45,111,245,0.12);color:var(--blue-300);}
.nav-item.active svg{opacity:1;}
.nav-badge{margin-left:auto;background:var(--red-500);color:#fff;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;padding:2px 6px;border-radius:99px;min-width:18px;text-align:center;}
.nav-sep{height:1px;background:var(--border-subtle);margin:8px 0;}
.sb-user{padding:14px 16px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;gap:10px;}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue-500),var(--purple-500));display:flex;align-items:center;justify-content:center;font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;}
.sb-user-info{min-width:0;}
.sb-user-name{font-size:13px;font-weight:600;color:var(--mist-300);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-user-role{font-size:11px;color:var(--mist-700);font-family:'Chakra Petch',sans-serif;letter-spacing:0.08em;text-transform:uppercase;}

/* TOPBAR */
.topbar-search{flex:1;max-width:360px;position:relative;}
.topbar-search input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);border-radius:9px;padding:8px 14px 8px 36px;font-size:13px;color:var(--mist-300);font-family:'Sora',sans-serif;outline:none;transition:border-color 0.2s;}
.topbar-search input:focus{border-color:var(--blue-400);}
.topbar-search input::placeholder{color:var(--mist-700);}
.topbar-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mist-700);pointer-events:none;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.tb-icon{width:36px;height:36px;background:none;border:1px solid var(--border-subtle);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mist-600);transition:border-color 0.2s,color 0.2s;position:relative;}
.tb-icon:hover{border-color:var(--border-default);color:var(--mist-400);}
.tb-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--red-500);border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;}
.topbar-title{font-family:'Chakra Petch',sans-serif;font-size:15px;font-weight:700;color:var(--mist-400);letter-spacing:0.04em;}
.tb-separator{width:1px;height:20px;background:var(--border-subtle);}

/* CARDS */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.kpi{background:var(--ink-850);border:1px solid var(--border-subtle);border-radius:14px;padding:20px;position:relative;overflow:hidden;}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.kpi.blue::after{background:var(--blue-500);}
.kpi.purple::after{background:var(--purple-500);}
.kpi.gold::after{background:var(--gold-500);}
.kpi.green::after{background:var(--green-500);}
.kpi-label{font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--mist-600);margin-bottom:10px;}
.kpi-val{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--mist-100);line-height:1;margin-bottom:8px;}
.kpi-delta{font-size:12px;display:flex;align-items:center;gap:4px;}
.kpi-delta.up{color:var(--green-500);}
.kpi-delta.down{color:var(--red-500);}
.kpi-delta.neutral{color:var(--mist-600);}

.row2{display:grid;grid-template-columns:1fr 360px;gap:16px;margin-bottom:24px;}
.card{background:var(--ink-850);border:1px solid var(--border-subtle);border-radius:14px;padding:20px;}
.card-title{font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--mist-500);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.card-title span{color:var(--mist-600);font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;}

/* TABLES */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--mist-700);padding:10px 12px;text-align:left;border-bottom:1px solid var(--border-subtle);}
td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--mist-400);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.tbl-name{color:var(--mist-200,#dde2f4);font-weight:500;}

/* BADGES */
.rank-badge{font-family:'Chakra Petch',sans-serif;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;letter-spacing:0.06em;}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;}
.pill{font-size:11px;font-family:'Chakra Petch',sans-serif;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:0.06em;text-transform:uppercase;}
.pill-blue{background:rgba(45,111,245,0.15);color:var(--blue-300);}
.pill-green{background:rgba(34,197,94,0.13);color:var(--green-500);}
.pill-orange{background:rgba(255,149,0,0.13);color:var(--orange-500);}
.pill-red{background:rgba(239,68,68,0.13);color:var(--red-500);}
.pill-purple{background:rgba(139,63,216,0.15);color:var(--purple-300);}
.pill-gray{background:rgba(255,255,255,0.06);color:var(--mist-600);}

/* FILTERS */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filter-btn{padding:7px 14px;background:var(--ink-800);border:1px solid var(--border-subtle);border-radius:8px;font-size:12px;color:var(--mist-600);cursor:pointer;font-family:'Chakra Petch',sans-serif;font-weight:600;letter-spacing:0.06em;transition:all 0.15s;}
.filter-btn:hover{border-color:var(--border-default);color:var(--mist-400);}
.filter-btn.active{background:rgba(45,111,245,0.12);border-color:var(--blue-500);color:var(--blue-300);}
.search-sm{padding:7px 12px 7px 32px;background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);border-radius:8px;font-size:13px;color:var(--mist-300);font-family:'Sora',sans-serif;outline:none;min-width:200px;transition:border-color 0.2s;}
.search-sm:focus{border-color:var(--blue-400);}
.search-sm::placeholder{color:var(--mist-700);}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--mist-700);}

/* PROGRESS BARS */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-label{font-size:12px;color:var(--mist-500);min-width:120px;}
.bar-track{flex:1;height:6px;background:var(--ink-600);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width 0.6s;}
.bar-val{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mist-400);min-width:52px;text-align:right;}

/* TIMELINE */
.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-subtle);}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.tl-content{flex:1;min-width:0;}
.tl-main{font-size:13px;color:var(--mist-300);line-height:1.5;}
.tl-main strong{color:var(--mist-100);}
.tl-meta{display:flex;gap:12px;margin-top:4px;font-size:11px;color:var(--mist-700);font-family:'JetBrains Mono',monospace;}

/* SECTION HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;gap:16px;}
.page-title h2{font-size:20px;color:var(--mist-100);margin-bottom:4px;}
.page-title p{font-size:13px;color:var(--mist-600);margin:0;}

/* CHARTS */
.chart-area{width:100%;height:140px;position:relative;}
.chart-area svg{width:100%;height:100%;}

/* ACTIVITY FEED */
.feed{display:flex;flex-direction:column;gap:0;max-height:320px;overflow-y:auto;}
.feed-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-subtle);}
.feed-item:last-child{border-bottom:none;}
.feed-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.feed-body{flex:1;min-width:0;}
.feed-text{font-size:13px;color:var(--mist-400);line-height:1.4;}
.feed-text strong{color:var(--mist-100);}
.feed-time{font-size:11px;color:var(--mist-700);font-family:'JetBrains Mono',monospace;margin-top:2px;}

/* SECTION: hidden by default */
.section{display:none;}
.section.active{display:block;}
</style>
</head>

// ─── CHART HELPERS ─────────────────────────────────────────────────────────
function linePath(data,W,H,pad){
  const max=Math.max(...data),min=Math.min(...data)*0.92,rng=max-min||1;
  const pts=data.map((v,i)=>{
    const x=(i/(data.length-1))*(W-pad*2)+pad;
    const y=H-pad-((v-min)/rng)*(H-pad*2);
    return[x,y];
  });
  const d=pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`${d} L${pts[pts.length-1][0]},${H-pad} L${pts[0][0]},${H-pad} Z`;
  return{d,area,pts};
}

      <div style="font-family:'Chakra Petch',sans-serif;font-size:14px;font-weight:700;color:var(--mist-100);margin-bottom:8px;">${title}</div>
      <div style="font-size:13px;color:var(--mist-600);line-height:1.6;margin-bottom:16px;min-height:52px;">${desc}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <span style="font-size:11px;color:var(--mist-700);font-family:'JetBrains Mono',monospace;">Gerado: ${date}</span>
        <button class="filter-btn" style="background:${col}22;color:${col};border-color:${col}44;font-size:11px;padding:5px 12px;">⬇ ${fmt}</button>
      </div>
    </div>`).join('')}
</div>`
};

// ─── FEED & POST-RENDER ──────────────────────────────────────────────────────
const feedItems = [
  {icon:'⚔️',bg:'rgba(45,111,245,0.15)',text:'<strong>Lucas Mendes</strong> completou Quest Diária — <strong>+120 XP</strong>',time:'há 2 min'},
  {icon:'⭐',bg:'rgba(245,197,24,0.15)',text:'<strong>Carla Santos</strong> subiu para Rank <strong>S</strong>',time:'há 5 min'},
  {icon:'🌐',bg:'rgba(139,63,216,0.15)',text:'Raid "Desafio Nacional" iniciada — <strong>1.247 hunters</strong>',time:'há 12 min'},
  {icon:'🛡️',bg:'rgba(239,68,68,0.12)',text:'IP <strong>189.63.44.128</strong> bloqueado automaticamente',time:'há 18 min'},
  {icon:'💰',bg:'rgba(34,197,94,0.12)',text:'<strong>Ana Ferreira</strong> assinou Premium',time:'há 31 min'},
  {icon:'🐛',bg:'rgba(255,149,0,0.12)',text:'Bug <strong>BG-046</strong> em correção — XP sync',time:'há 45 min'},
];

function renderPostDashboard(){
  // Feed
  const feed = document.getElementById('feed');
  if(feed) feed.innerHTML = feedItems.map(f=>`<div class="feed-item">
    <div class="feed-icon" style="background:${f.bg}">${f.icon}</div>
    <div class="feed-body"><div class="feed-text">${f.text}</div><div class="feed-time">${f.time}</div></div>
  </div>`).join('');

  // Top events
  const te = document.getElementById('top-events');
  if(te) te.innerHTML = eventFreq.slice(0,4).map(e=>`<div style="background:var(--ink-800);border:1px solid var(--border-subtle);border-radius:10px;padding:14px;">
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${e.color};letter-spacing:0.06em;margin-bottom:6px;">${e.name}</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--mist-100);">${(e.count/1000).toFixed(1)}k</div>
  </div>`).join('');

  // DAU line chart
  const area = document.getElementById('dau-chart');
  if(area){
    const W=area.offsetWidth||600,H=140;
    const {d,area:a,pts}=linePath(dauData,W,H,16);
    area.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="dauGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2D6FF5" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#2D6FF5" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${Array.from({length:5},(_,i)=>{const y=H-16-i*(H-32)/4;return`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;}).join('')}
      <path d="${a}" fill="url(#dauGrad)"/>
      <path d="${d}" stroke="#4D8BFF" stroke-width="2" fill="none"/>
      ${pts.map((p,i)=>i===pts.length-1?`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#4D8BFF" stroke="var(--ink-850)" stroke-width="2"/>`:'').join('')}
    </svg>`;
  }
}

function renderPostEvents(){
  const el=document.getElementById('events-svg');
  if(!el)return;
  const total=eventFreq.reduce((s,e)=>s+e.count,0);
  const W=el.offsetWidth||320,H=220,cx=W/2,cy=H/2,r=80,ri=50;
  let angle=0;
  const paths=eventFreq.map(e=>{
    const slice=(e.count/total)*Math.PI*2;
    const x1=cx+r*Math.sin(angle),y1=cy-r*Math.cos(angle);
    const x2=cx+r*Math.sin(angle+slice),y2=cy-r*Math.cos(angle+slice);
    const xi1=cx+ri*Math.sin(angle),yi1=cy-ri*Math.cos(angle);
    const xi2=cx+ri*Math.sin(angle+slice),yi2=cy-ri*Math.cos(angle+slice);
    const large=slice>Math.PI?1:0;
    const d=`M${xi1},${yi1} L${x1},${y1} A${r},${r},0,${large},1,${x2},${y2} L${xi2},${yi2} A${ri},${ri},0,${large},0,${xi1},${yi1}Z`;
    angle+=slice;
    return`<path d="${d}" fill="${e.color}" opacity="0.85"/>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">
    ${paths.join('')}
    <text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="12" fill="#AEB4D0">${(total/1000).toFixed(0)}k</text>
  </svg><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">${eventFreq.map(e=>`<span style="font-size:11px;display:flex;align-items:center;gap:4px;color:var(--mist-500);"><span style="width:8px;height:8px;border-radius:2px;background:${e.color};flex-shrink:0;display:inline-block;"></span>${e.name}</span>`).join('')}</div>`;
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
const titles={dashboard:'Dashboard',users:'Usuários',tickets:'Tickets',bugs:'Bug Tracker',security:'Segurança',audit:'Audit Log',events:'Eventos',engagement:'Engajamento',reports:'Relatórios'};

function nav(el,section){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('topbar-title').textContent=titles[section]||section;
  document.getElementById('content').innerHTML=pages[section]?pages[section]():'';
  if(section==='dashboard') setTimeout(renderPostDashboard,50);
  if(section==='events') setTimeout(renderPostEvents,50);
}

// Initial render
nav(document.querySelector('.nav-item'),'dashboard');
</script>
