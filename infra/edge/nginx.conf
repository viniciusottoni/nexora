user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;

  server {
    listen 80;
    server_name edge.local;
    return 308 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name edge.local;
    ssl_certificate /etc/nginx/tls/edge.local.crt;
    ssl_certificate_key /etc/nginx/tls/edge.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz { return 200 "OK\n"; }
    location /v1/ {
      proxy_pass http://api-edge:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /rt {
      proxy_pass http://api-edge:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
    location /pos/ { try_files $uri $uri/ /pos/index.html; }
    location /kds/ { try_files $uri $uri/ /kds/index.html; }
    location /menu/ { try_files $uri $uri/ /menu/index.html; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location = / { return 302 /pos/; }
  }
}
