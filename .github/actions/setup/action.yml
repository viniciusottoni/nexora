name: Preparar monorepo
description: Instala Node, .NET e dependências de forma reproduzível
runs:
  using: composite
  steps:
    - name: Ativar pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false
    - name: Instalar Node 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Instalar dependências
      shell: bash
      run: pnpm install --frozen-lockfile
    # .NET 10 (backend/global.json) — usado pelos jobs "Integração e RLS", "Contrato OpenAPI" e
    # "Imagens" (US-007). Instalar aqui também nos jobs puramente TS/JS (Qualidade/Segurança/Build)
    # é um custo pequeno e aceitável pela simplicidade de uma única action de setup para todo o
    # pipeline, em vez de duplicar o passo em cada job que precisa de .NET.
    - name: Instalar .NET SDK 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
